<section class="field"><div class="hd"><label>Finding Title</label><button class="btn" data-c="0">Copy</button></div><textarea readonly rows="8">Anyone can bypass an IKR enter gate&#x27;s whitelist by deploying an adapter from the registered factory and self-admitting</textarea></section><section class="field"><div class="hd"><label>Finding Description</label><button class="btn" data-c="1">Copy</button></div><textarea readonly rows="8">## Summary

`IKRCompatibleEnterGate.admit` authenticates the *factory that deployed the caller*, never the caller itself, the vault behind it, or the admitted user. Because `MidnightAdapterFactory.createMidnightAdapter` is permissionless and the adapter constructor does not validate `parentVault`, any account can deploy a stub vault plus an adapter from the registered factory, admit itself, and take credit in a gated market that it is not whitelisted for. The whitelist is therefore advisory rather than enforced.

**Severity:** Low — **Likelihood:** High — **Impact:** Low

## Finding Description

Midnight calls `canIncreaseCredit(buyer)` on every credit-increasing buy (`lib/midnight/src/Midnight.sol:384-387`). For gated markets the gate is expected to be the entry boundary. `IKRCompatibleEnterGate` implements that boundary as follows (`src/adapters/midnight/gates/IKRCompatibleEnterGate.sol:36-45`):

```solidity
function admit(address user, address adapterFactory) external {
    require(admitEnabled, AdmitDisabled());
    require(
        admitterFactory[adapterFactory] &amp;&amp; IMidnightAdapterFactory(adapterFactory).isCreated(msg.sender),
        Unauthorized()
    );
    admitted = user;
    emit Admit(msg.sender, user, adapterFactory);
}
```

The two checks are, in order: (1) the *factory argument* is registered by the role setter, and (2) the *caller* was deployed by that factory. Nothing binds the caller to a known vault, to a real vault at all, or `user` to a share balance. `admitted` is transient and is consumed by `canIncreaseCredit` for the caller only.

The gate&#x27;s own NatSpec states the invariant it believes it has: the caller &quot;must be debt-free, check the buyer holds its vault&#x27;s shares&quot;. Neither property is verified on-chain.

`MidnightAdapterFactory.createMidnightAdapter` is permissionless (`src/adapters/midnight/MidnightAdapterFactory.sol:26-37`) and `MidnightAdapter`&#x27;s constructor only calls `asset()` and `setIsAuthorized()` on its constructor arguments, so `parentVault` may be a four-line stub.

**Propagation path** — the attacker never touches the real vault, the curator, or any allow-list:

1. deploy `StubVault` exposing `asset()`, returning the market&#x27;s loan token;
2. `factory.createMidnightAdapter(asset, stubVault, midnight, ...)` — succeeds for anyone;
3. on the freshly deployed adapter, call `admit(attacker, address(factory))` — both checks pass: the factory is registered and it did deploy the adapter;
4. call `Midnight.take(offer, ...)` as the taker. Midnight&#x27;s enter gate calls `canIncreaseCredit(attacker)`, which returns true because `admitted == attacker` and `msg.sender == adapter`;
5. `onBuy` runs on the fake adapter; `parentVault` is dereferenced only for event/reporting paths, which the stub satisfies.

Guarantee broken: **the gate no longer restricts who may hold credit in a gated market**. Buyers must still pay the offer price; the bypass is about entry, not liquidity.

`admitEnabled == false` still blocks the fake adapter, so the gate is not dead — only admission is unbound (see PoC control `testPocDisabledGateStillRejects`).</textarea></section><section class="field"><div class="hd"><label>Impact Explanation</label><button class="btn" data-c="2">Copy</button></div><textarea readonly rows="8">Low. The attacker gains the same credit position a genuinely whitelisted buyer would get, at the same price, and the position behaves identically afterwards (redeem, sell, transfer) because Midnight only knows the buyer address. Nothing breaks for existing holders, pricing is untouched, and no exit is blocked.

Why not Medium: no funds are lost, no accounting is corrupted, and no DoS is possible. Medium becomes defensible only where the gate is the compliance boundary of a permissioned pool rather than a soft preference — then &quot;not whitelisted&quot; and &quot;cannot enter&quot; stop being equivalent, which is exactly the security guarantee the gate advertises.

Why not High: the attacker still has to fund the purchase; entry alone does not move value.</textarea></section><section class="field"><div class="hd"><label>Likelihood Explanation</label><button class="btn" data-c="3">Copy</button></div><textarea readonly rows="8">High, and fully deterministic. There is no privileged role, no waiting period and no capital lock-up beyond the price itself. The setup is one adapter deployment, reused forever: after it exists, the exploit is a single `take` per offer in every market using that gate, repeatable by any EOA, for as long as admission is enabled. Nothing needs to be discovered or timed, and the deployed adapter is never touched again after `admit`, so its state does not have to survive.</textarea></section><section class="field"><div class="hd"><label>Proof of Concept</label><button class="btn" data-c="4">Copy</button></div><textarea readonly rows="8">Secret gist: https://gist.github.com/awkarinh37-ux/48e480866150936cd4d3708311f5f975

File: `test/PocGateAdmission.t.sol`, run in the repository harness against the real `Midnight` and the real `VaultV2`:

```
$ forge test --match-contract PocGateAdmission --match-test testPoc -vv

Ran 2 tests for test/PocGateAdmission.t.sol:PocGateAdmission
[PASS] testPocDisabledGateStillRejects() (gas: 28132394)
[PASS] testPocFakeAdapterAdmitsAnyone() (gas: 28407576)
Suite result: ok. 2 passed; 0 failed; 0 skipped; finished in 53.11ms (28.87ms CPU time)
```

The exploit asserts, in order: `canIncreaseCredit(attacker)` is false; the take reverts `BuyerGatedFromIncreasingCredit` (negative control — the gate really is enforcing something); a stub vault + adapter is deployed from the registered factory; the fake adapter calls `admit(attacker, factory)` and `canIncreaseCredit(attacker)` flips to true; the same take succeeds and the attacker holds `0.5e18` credit.

PoC sketch:

```solidity
function testPocFakeAdapterAdmitsAnyone() public {
    (Offer memory offer, bytes32 marketId) = _gatedOffer();     // gate on, attacker not allowed
    assertFalse(gate.canIncreaseCredit(attacker));               // control
    vm.expectRevert(Midnight.BuyerGatedFromIncreasingCredit.selector);
    vm.prank(attacker); midnight.take(offer, &quot;&quot;, units, &quot;&quot;);

    StubVault stub = new StubVault(address(loanToken));
    MidnightAdapter fake = factory.createMidnightAdapter(
        address(loanToken), address(stub), address(midnight), ...
    );
    fake.admit(attacker, address(factory));                      // permissionless
    assertTrue(gate.canIncreaseCredit(attacker));                 // whitelist bypassed

    vm.prank(attacker); midnight.take(offer, &quot;&quot;, units, &quot;&quot;);      // succeeds
    assertEq(midnight.credit(marketId, attacker), units);
}
```</textarea></section><section class="field"><div class="hd"><label>Recommendation</label><button class="btn" data-c="5">Copy</button></div><textarea readonly rows="8">Bind admission to something the gate verifies itself instead of trusting the caller. Minimal change:

```solidity
function admit(address user, address adapterFactory) external {
    require(admitEnabled, AdmitDisabled());
    require(
        admitterFactory[adapterFactory] &amp;&amp; IMidnightAdapterFactory(adapterFactory).isCreated(msg.sender),
        Unauthorized()
    );
    // caller must be a real adapter over a vault the gate knows, and the user must hold its shares
    address vault = IMidnightAdapter(msg.sender).parentVault();
    require(allowedVault[vault], Unauthorized());
    require(IVault(vault).balanceOf(user) &gt; 0, Unauthorized());

    admitted = user;
    emit Admit(msg.sender, user, adapterFactory);
}
```

`allowedVault` would be populated by the existing `roleSetter` next to `admitterFactory`. This restores the documented &quot;debt-free, holds shares&quot; semantics and closes the stub-adapter path; registering `(vault, factory)` pairs instead of bare factories is an equivalent fix.</textarea></section>
